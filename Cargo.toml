[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes/wc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[workspace.dependencies]
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "backend_gbm", "backend_egl", "renderer_gl", "wayland_frontend", "desktop", "use_system_lib"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
