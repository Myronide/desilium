[workspace]
members = ["crates/core", "crates/compositor", "crates/settings", "crates/demo"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wc-core = { path = "crates/core" }

[profile.dev]
debug = 0
