[package]
name = "desilium-kwin"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Bridge between the typed Desilium configuration and the KWin compositor"

[[bin]]
name = "desilium-kwin"
path = "src/main.rs"

[dependencies]
desilium-apps = { path = "../desilium-apps" }
desilium-config = { path = "../desilium-config" }
desilium-config-types = { path = "../desilium-config-types" }
desilium-theme = { path = "../desilium-theme" }

inotify = "0.11"
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zbus = "5"

[dev-dependencies]
tempfile = "3"
