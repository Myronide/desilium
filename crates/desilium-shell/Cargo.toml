[package]
name = "desilium-shell"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Desilium desktop shell process: top bar, dock and launcher"

[dependencies]
desilium-apps = { path = "../desilium-apps" }
desilium-config = { path = "../desilium-config" }
desilium-config-types = { path = "../desilium-config-types" }
desilium-kwin = { path = "../desilium-kwin" }
desilium-theme = { path = "../desilium-theme" }
desilium-ui = { path = "../desilium-ui" }

calloop = "0.14"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
inotify = "0.11"
serde = { workspace = true }
thiserror.workspace = true
toml = "0.8"
tracing.workspace = true
tracing-subscriber.workspace = true
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

[dev-dependencies]
png = "0.17"
tempfile = "3"
