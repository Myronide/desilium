<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">

<title>Desilium - Window Switcher</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shared.css">

<style>
  .sw { position: absolute; left: 50%; top: 330px; transform: translateX(-50%); padding: 20px 20px 18px; border-radius: 28px; display: flex; flex-direction: column; gap: 16px; align-items: center;
        background: var(--glass-sheen), var(--glass-bg-strong); border: 1px solid var(--glass-border); box-shadow: var(--shadow-4), inset 0 1px 0 var(--glass-highlight); }
  .cards { display: flex; gap: 12px; }
  .wcard { width: 232px; padding: 10px; border-radius: 18px; display: flex; flex-direction: column; gap: 10px; position: relative; border: 1px solid transparent; }
  .wcard.sel { background: var(--selected); border-color: var(--accent-line); box-shadow: 0 0 0 2px var(--accent), 0 8px 24px rgba(123,97,255,.25); }
  .wcard .hd { display: flex; align-items: center; gap: 8px; height: 24px; }
  .wcard .hd span { font-size: 12px; font-weight: 500; color: var(--text-2); }
  .wcard.sel .hd span { color: var(--text); }
  .th { height: 132px; border-radius: 10px; overflow: hidden; background: var(--window-bg); border: 1px solid var(--window-border); box-shadow: var(--shadow-2); display: flex; flex-direction: column; position: relative; }
  .th .tb { height: 14px; background: var(--titlebar-bg); border-bottom: 1px solid var(--divider); display: flex; align-items: center; gap: 3px; padding: 0 5px; flex: none; }
  .th .tb i { width: 5px; height: 5px; border-radius: 3px; background: var(--text-disabled); display: block; }
  .th .bd { flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .th .bd u { display: block; height: 5px; border-radius: 3px; background: var(--surface-3); text-decoration: none; }
  .th .bd u.a { background: var(--accent); opacity: .9; }
  .th.term { background: #0B0D14; }
  .th.term .tb { background: #151823; border-color: rgba(255,255,255,.06); }
  .th.term .bd u { background: #2E3550; }
  .th.term .bd u.g { background: #2FCB84; opacity: .8; }
  .th .split { flex: 1; display: flex; }
  .th .split .l { width: 54px; background: var(--surface-2); border-right: 1px solid var(--divider); }
  .th .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; flex: 1; }
  .th .grid b { display: block; border-radius: 5px; background: var(--surface-3); }
  .th .web { flex: 1; background: linear-gradient(180deg, var(--surface-2), var(--surface-1)); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .th .web .hero { height: 46px; border-radius: 6px; background: linear-gradient(135deg, #35D0C0, #7B61FF); }
  .xbtn { position: absolute; right: 4px; top: 4px; width: 22px; height: 22px; border-radius: 11px; background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; }
  .xbtn .ic { width: 12px; height: 12px; stroke-width: 2; }
  .cap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .cap .t { font-size: 20px; font-weight: 600; line-height: 28px; letter-spacing: -0.01em; }
  .hints { display: flex; gap: 18px; color: var(--text-3); font-size: 12px; }
  .hints .h { display: flex; align-items: center; gap: 6px; }
  .badge { position: absolute; right: 12px; bottom: 12px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--surface-4); font-size: 10px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; }
</style>
</head>
