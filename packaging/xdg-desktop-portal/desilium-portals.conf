# Portal backend preferences for the Desilium session.
#
# xdg-desktop-portal reads <XDG_CURRENT_DESKTOP entry, lowercased>-portals.conf. The session sets
# XDG_CURRENT_DESKTOP=Desilium:KDE, so this file is tried first and kde-portals.conf is the
# fallback. Keep it in /usr/share/xdg-desktop-portal/ (install.sh does).
#
# KWin implements screen casting, remote desktop and the screenshot service itself, and only the
# KDE portal backend (xdg-desktop-portal-kde) knows how to talk to them, so those interfaces go to
# it. Everything else (file chooser, settings, app chooser, ...) stays with the GTK backend, which
# works without Plasma.
#
# TODO(desilium-portal): a native Desilium portal backend (org.freedesktop.impl.portal.desktop.desilium)
# will go here once it exists. Its .portal file must declare UseIn=Desilium, and it then becomes
# the first entry:  default=desilium;gtk

[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=kde
org.freedesktop.impl.portal.RemoteDesktop=kde
org.freedesktop.impl.portal.Screenshot=kde
org.freedesktop.impl.portal.GlobalShortcuts=kde
org.freedesktop.impl.portal.InputCapture=kde
