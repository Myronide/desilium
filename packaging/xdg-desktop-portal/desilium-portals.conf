# Portal backend preferences for the Desilium session.
#
# xdg-desktop-portal reads <XDG_CURRENT_DESKTOP lowercased>-portals.conf, so this file
# applies to the "Desilium" desktop. Keep it in /usr/share/xdg-desktop-portal/ (install.sh does).
#
# Today every interface is served by the GTK backend, which works on any Wayland compositor
# that implements the standard protocols (file chooser, settings, notifications, app chooser).
#
# TODO(desilium-portal): a native Desilium portal backend (org.freedesktop.impl.portal.desktop.desilium)
# will go here once it exists. Its .portal file must declare UseIn=Desilium, and it then becomes
# the first entry:  default=desilium;gtk
# Interfaces that need compositor-specific behaviour (screen capture, global shortcuts) belong
# under their own key once the compositor offers the protocols for them.

[preferred]
default=gtk
